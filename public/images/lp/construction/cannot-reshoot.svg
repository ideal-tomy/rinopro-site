<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block" viewBox="0 0 880 450" role="img" aria-labelledby="crTitle crDesc">
  <title id="crTitle">後から撮り直せる写真は、1枚もない</title>
  <desc id="crDesc">着工前・施工中・完成の3枚の写真。完成した後では、着工前と施工中の写真は撮ることができない。</desc>

  <style>
    svg{
      --ink:#1F2A33; --line:#3A4650; --muted:#6B7780;
      --soft:#F4F6F7; --edge:#C4CBD1; --solid:#B9C1C7;
      --loss:#A8574B;
      color-scheme: light only;
      font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
    }
    .t{fill:var(--ink)} .t-mut{fill:var(--muted)} .t-loss{fill:var(--loss)}
    .frame{fill:var(--soft);stroke:var(--line);stroke-width:1.8}
    .axis{stroke:var(--line);stroke-width:1.6;fill:none}
    .back{stroke:var(--loss);stroke-width:1.8;fill:none;stroke-dasharray:7 6}
  </style>

  <defs>
    <marker id="crAh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4650"/>
    </marker>
    <marker id="crAhL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8574B"/>
    </marker>
    <clipPath id="f1"><rect x="55" y="92" width="220" height="140"/></clipPath>
    <clipPath id="f2"><rect x="330" y="92" width="220" height="140"/></clipPath>
    <clipPath id="f3"><rect x="605" y="92" width="220" height="140"/></clipPath>
  </defs>

  <!-- 見出し -->
  <text class="t" x="165" y="76" text-anchor="middle" font-size="15.5" font-weight="700">① 着工前</text>
  <text class="t" x="440" y="76" text-anchor="middle" font-size="15.5" font-weight="700">② 施工中（配筋）</text>
  <text class="t" x="715" y="76" text-anchor="middle" font-size="15.5" font-weight="700">③ 完成</text>

  <!-- ① 着工前：地盤が見えている -->
  <rect class="frame" x="55" y="92" width="220" height="140" rx="3"/>
  <g clip-path="url(#f1)">
    <rect x="55" y="196" width="220" height="36" fill="var(--edge)"/>
  </g>
  <text class="t-mut" x="165" y="256" text-anchor="middle" font-size="13.5">地盤が見えている</text>

  <!-- ② 施工中：鉄筋が見えている -->
  <rect class="frame" x="330" y="92" width="220" height="140" rx="3"/>
  <g clip-path="url(#f2)">
    <rect x="330" y="196" width="220" height="36" fill="var(--edge)"/>
    <g stroke="#8A939B" stroke-width="3">
      <line x1="360" y1="128" x2="360" y2="196"/><line x1="392" y1="128" x2="392" y2="196"/>
      <line x1="424" y1="128" x2="424" y2="196"/><line x1="456" y1="128" x2="456" y2="196"/>
      <line x1="488" y1="128" x2="488" y2="196"/><line x1="520" y1="128" x2="520" y2="196"/>
      <line x1="342" y1="146" x2="540" y2="146"/><line x1="342" y1="176" x2="540" y2="176"/>
    </g>
  </g>
  <text class="t-mut" x="440" y="256" text-anchor="middle" font-size="13.5">鉄筋が見えている</text>

  <!-- ③ 完成：覆われて見えない -->
  <rect class="frame" x="605" y="92" width="220" height="140" rx="3"/>
  <g clip-path="url(#f3)">
    <rect x="605" y="196" width="220" height="36" fill="var(--edge)"/>
    <g stroke="#8A939B" stroke-width="3" opacity="0.16">
      <line x1="635" y1="128" x2="635" y2="196"/><line x1="667" y1="128" x2="667" y2="196"/>
      <line x1="699" y1="128" x2="699" y2="196"/><line x1="731" y1="128" x2="731" y2="196"/>
      <line x1="763" y1="128" x2="763" y2="196"/><line x1="795" y1="128" x2="795" y2="196"/>
    </g>
    <rect x="605" y="122" width="220" height="78" fill="var(--solid)"/>
  </g>
  <text class="t-mut" x="715" y="256" text-anchor="middle" font-size="13.5">中はもう見えない</text>

  <!-- 工事の進行 -->
  <path class="axis" d="M55,300 L830,300" marker-end="url(#crAh)"/>
  <g stroke="var(--line)" stroke-width="1.2">
    <line x1="165" y1="295" x2="165" y2="306"/>
    <line x1="440" y1="295" x2="440" y2="306"/>
    <line x1="715" y1="295" x2="715" y2="306"/>
  </g>
  <text class="t-mut" x="828" y="322" text-anchor="end" font-size="13">工事の進行</text>
  <circle cx="715" cy="300" r="7" fill="var(--ink)"/>
  <text class="t" x="715" y="284" text-anchor="middle" font-size="13.5" font-weight="700">いま（提出前・監査）</text>

  <!-- 戻れない -->
  <path class="back" d="M700,352 L200,352" marker-end="url(#crAhL)"/>
  <g stroke="var(--loss)" stroke-width="2.8" stroke-linecap="round">
    <line x1="432" y1="344" x2="448" y2="360"/><line x1="448" y1="344" x2="432" y2="360"/>
    <line x1="180" y1="344" x2="196" y2="360"/><line x1="196" y1="344" x2="180" y2="360"/>
  </g>
  <text class="t-loss" x="450" y="382" text-anchor="middle" font-size="14" font-weight="700">戻って撮り直すことはできない</text>

  <!-- 締め -->
  <text class="t" x="440" y="428" text-anchor="middle" font-size="19" font-weight="700">①②の写真は、③になってからでは撮れない。</text>
</svg>
