<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXEON コンサルティング v3 表示比較</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #eef2f6; color: #0b1933; font: 16px/1.7 system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 24px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(180px, .48fr); gap: 20px; align-items: start; }
  figure { margin: 0; min-width: 0; }
  figcaption { margin-bottom: 12px; font-weight: 700; }
  img { display: block; width: 100%; height: auto; border: 1px solid #d5e2f2; }
  a { color: #234b9d; }
  @media(max-width: 800px) { main { grid-template-columns: 1fr; } figure:last-child { max-width: 390px; } }
</style>
<h1>コンサルティングページ v3</h1>
<p>添付の完成イメージと実装を比較できます。画像を選ぶと元の解像度で開きます。ヘッダー・フッターは既存サイトを再利用しています。</p>
<main>
  <figure><figcaption>完成イメージ</figcaption><a href="../AXEONコンサルティング支援ページ.png"><img src="../AXEONコンサルティング支援ページ.png" alt="ユーザー提供の完成イメージ"></a></figure>
  <figure><figcaption>実装：PC 1440px</figcaption><a href="full-1440.png"><img src="full-1440.png" alt="実装ページのPC表示"></a></figure>
  <figure><figcaption>実装：スマホ 390px</figcaption><a href="full-390.png"><img src="full-390.png" alt="実装ページのスマホ表示"></a></figure>
</main>
</html>
