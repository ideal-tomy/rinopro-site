<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block" viewBox="0 0 880 450" role="img" aria-labelledby="sqlTitle sqlDesc">
  <title id="sqlTitle">同じ質問が毎週戻る。根拠が残らないから</title>
  <desc id="sqlDesc">質問・探索・口頭回答の円環。出典が残らず、毎週また同じ質問に戻る。</desc>
  <style>
    svg{
      --ink:#1F2A33; --line:#3A4650; --muted:#6B7780;
      --soft:#F4F6F7; --edge:#C4CBD1;
      --loss:#A8574B;
      color-scheme: light only;
      font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;
    }
    .t{fill:var(--ink)} .t-mut{fill:var(--muted)} .t-loss{fill:var(--loss)}
    .loop{stroke:var(--line);stroke-width:2.4;fill:none}
    .gap{stroke:var(--loss);stroke-width:2.4;fill:none;stroke-dasharray:8 6}
</style>
  <defs>
    <marker id="sqlAh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4650"/>
    </marker>
    <marker id="sqlAhL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8574B"/>
    </marker>
  </defs>
  <circle cx="360" cy="200" r="130" class="loop"/>
  <path class="gap" d="M360,70 A130,130 0 0 1 490,200"/>
  <rect x="300" y="50" width="120" height="42" rx="3" fill="#FFFFFF" stroke="var(--line)" stroke-width="1.6"/>
  <text class="t" x="360" y="76" text-anchor="middle" font-size="14" font-weight="700">質問</text>
  <rect x="450" y="170" width="120" height="42" rx="3" fill="#FFFFFF" stroke="var(--line)" stroke-width="1.6"/>
  <text class="t" x="510" y="196" text-anchor="middle" font-size="14" font-weight="700">探索</text>
  <rect x="300" y="290" width="120" height="42" rx="3" fill="#FFFFFF" stroke="var(--line)" stroke-width="1.6"/>
  <text class="t" x="360" y="316" text-anchor="middle" font-size="14" font-weight="700">口頭回答</text>
  <rect x="180" y="170" width="120" height="42" rx="3" fill="var(--soft)" stroke="var(--loss)" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="t-loss" x="240" y="196" text-anchor="middle" font-size="13" font-weight="700">出典なし</text>
  <text class="t-loss" x="360" y="200" text-anchor="middle" font-size="18" font-weight="700">毎週</text>
  <path d="M520,100 C560,80 600,100 610,140" class="gap" marker-end="url(#sqlAhL)"/>
  <text class="t-loss" x="650" y="130" text-anchor="middle" font-size="14" font-weight="700">また質問へ</text>
  <rect x="600" y="220" width="200" height="90" rx="3" fill="var(--soft)" stroke="var(--edge)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text class="t-mut" x="700" y="255" text-anchor="middle" font-size="13">組織記憶が残らない</text>
  <text class="t-loss" x="700" y="285" text-anchor="middle" font-size="14" font-weight="700">次の人も同じ迷路</text>
  <text class="t" x="440" y="400" text-anchor="middle" font-size="19" font-weight="700">根拠が残らないと、同じ問い合わせが何度でも戻る。</text>
  <text class="t-mut" x="440" y="430" text-anchor="middle" font-size="13.5">口頭で済ませると、次の人がまた探索を始める</text>
</svg>
